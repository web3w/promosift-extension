<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="color-scheme" content="dark light" />
  <title>PromoSift</title>
  <link rel="icon" href="icons/brand.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body data-login-state="idle">
  <header class="pop-head">
    <div class="mark" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 20 20" fill="none">
        <rect x="2.4" y="4" width="15.2" height="2.6" rx="1.3" fill="currentColor" />
        <rect x="2.4" y="8.7" width="10" height="2.6" rx="1.3" fill="currentColor" />
        <rect x="2.4" y="13.4" width="13" height="2.6" rx="1.3" fill="currentColor" />
      </svg>
    </div>
    <div class="brand">
      <div class="t">PromoSift</div>
      <div class="s" data-i18n="popupSubtitle"></div>
    </div>
  </header>

  <!-- ========== Logged-out: multi-step sign-in flow ========== -->
  <section id="loginView" hidden>
    <div class="pop-body">
      <div class="status" id="authStatus" aria-live="polite">
        <i></i>
        <span data-show="idle sending sent error expired" data-i18n="statusSignedOut"></span>
        <span data-show="done" data-i18n="statusSignedIn"></span>
      </div>

      <section class="card login-card">
        <div data-show="idle sending">
          <h3 class="ct">
            <span data-i18n="loginStepEmailTitle"></span>
            <span class="steps" aria-hidden="true"><b class="on"></b><b></b></span>
          </h3>
          <p class="cs" data-i18n="loginStepEmailNote"></p>
          <button type="button" class="google-login" id="googleLogin" disabled><img src="icons/google-g.png" width="18" height="18" alt="" /><span data-i18n="googleLogin"></span></button>
          <p class="login-divider" data-i18n="loginOrEmail"></p>
          <form class="frow" id="requestCodeForm">
            <input id="email" class="in" type="email" inputmode="email" autocomplete="email" required maxlength="254" data-i18n-placeholder="loginEmailPlaceholder" data-i18n-aria-label="loginLabel" />
            <button type="submit" id="requestCode" disabled class="btn btn-brand btn36" data-i18n="loginSendCode"></button>
          </form>
          <p class="err" id="emailError" hidden data-i18n="loginInvalidEmail"></p>
          <div class="reward">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M6 1l1.3 3.2L10.5 5 7.3 6.3 6 9.5 4.7 6.3 1.5 5l3.2-.8z" fill="currentColor" /></svg>
            <span data-i18n="loginRewardNote"></span>
          </div>
        </div>

        <div data-show="sent error expired">
          <h3 class="ct">
            <span data-i18n="loginStepCodeTitle"></span>
            <span class="steps" aria-hidden="true"><b class="on"></b><b class="on"></b></span>
          </h3>
          <p class="cs" id="loginStepCodeNote" data-i18n="loginStepCodeNote"></p>
          <div class="sentline">
            <span data-i18n="loginSentTo"></span>
            <b id="sentToEmail"></b>
            <button type="button" id="changeEmail" data-i18n="loginChangeEmail"></button>
          </div>
          <form id="loginForm">
            <input id="loginCode" class="in otp" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required data-i18n-placeholder="loginCodePlaceholder" data-i18n-aria-label="loginCodeAriaLabel" />
            <p class="err" id="codeError" hidden data-i18n="loginInvalidCode"></p>
            <div class="auxline">
              <span data-i18n="loginCheckSpam"></span>
              <button type="button" id="resendCode" disabled></button>
            </div>
            <button type="submit" id="login" class="btn btn-brand btn36 btn-block" aria-disabled="true" disabled data-i18n="loginSubmit"></button>
          </form>
        </div>

        <div data-show="done">
          <div class="done-box">
            <div class="ring" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 12 12" fill="none"><path d="M2.2 6.4l2.3 2.3 5-5.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
            </div>
            <div class="dt" data-i18n="loginDoneTitle"></div>
            <div class="ds" id="loginDoneNote"></div>
          </div>
          <button type="button" class="btn btn36 btn-block" id="loginDoneClose" data-i18n="loginDoneClose"></button>
        </div>
        <!-- 同意项不随登录步骤隐藏；旧账户登录后仍需明确勾选。 -->
        <div class="data-consent" id="dataConsentNotice" hidden>
          <div class="data-consent-row">
            <input type="checkbox" id="acceptDataConsent" aria-labelledby="dataConsentLabel" />
            <div><label id="dataConsentLabel" for="acceptDataConsent" data-i18n="dataConsentDescription"></label> <a href="https://promosift.app/privacy.html" target="_blank" rel="noopener noreferrer" data-i18n="footerPrivacy"></a></div>
          </div>
          <p class="err" id="dataConsentError" role="status" hidden></p>
        </div>
      </section>

      <p class="status" id="loginStatus" data-tone="error" role="status" aria-live="polite" hidden></p>
    </div>
    <!-- 登录前各步骤均可查看协议，沿用现有页脚样式和翻译。 -->
    <footer class="pop-foot">
      <span class="grp-inline">
        <a href="https://promosift.app/terms.html" target="_blank" rel="noopener noreferrer" data-i18n="footerTerms"></a>
        <span class="sep-dot" aria-hidden="true">·</span>
        <a href="https://promosift.app/privacy.html" target="_blank" rel="noopener noreferrer" data-i18n="footerPrivacy"></a>
      </span>
    </footer>
  </section>

  <!-- ========== Logged-in: account, stats, settings ========== -->
  <section id="appView" hidden>
    <div class="pop-body">

      <section class="card" id="account" aria-live="polite">
        <div class="line">
          <span class="lbl" data-i18n="accountCreditsLabel"></span>
          <span class="ok-badge" id="refreshedBadge" hidden>
            <svg width="10" height="10" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M2.2 6.4l2.3 2.3 5-5.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
            <span data-i18n="accountRefreshed"></span>
          </span>
        </div>
        <div class="quota"><b id="creditsValue">0</b><span id="creditsUnit"></span></div>
        <div class="bar"><i id="creditsBar" style="width: 0%"></i></div>
        <div class="line"><span class="mail" id="accountUsedLine"></span><span class="lbl" id="accountEmail"></span></div>
        <div class="sep"></div>
        <div class="acts">
          <button type="button" class="btn btn-brand" id="checkIn" disabled data-i18n="checkInQuerying"></button>
          <a class="btn" href="https://promosift.app/account" target="_blank" rel="noopener noreferrer" data-i18n="accountBuyCredits"></a>
          <span class="lbl" id="checkInNote" style="margin-left: auto"></span>
        </div>
        <p class="status" id="accountStatus" role="status" aria-live="polite" hidden></p>
      </section>

      <section class="session-stats">
        <div class="gsp"><span data-i18n="statsHeading"></span><span class="live" data-i18n="statsAutoTally"></span></div>
        <div class="stats">
          <div class="tile"><div class="v" id="checked">0</div><div class="k" data-i18n="statsCheckedThisSession"></div></div>
          <div class="tile"><div class="v amber" id="ads">0</div><div class="k" data-i18n="statsFlaggedAsAd"></div></div>
          <div class="tile"><div class="v amber" id="rate">–</div><div class="k" data-i18n="statsAdRate"></div><div class="mini"><i id="rateBar" style="width: 0%"></i></div></div>
        </div>
      </section>

      <section>
        <div class="gsp"><span data-i18n="displayModeLabel"></span></div>
        <div class="seg" role="radiogroup" data-name="mode" data-i18n-aria-label="displayModeLabel">
          <button type="button" role="radio" data-value="label" aria-checked="true" data-i18n="displayModeLabelOnly"></button>
          <button type="button" role="radio" data-value="fold" aria-checked="false" data-i18n="displayModeFold"></button>
        </div>
        <p class="note" id="modeNote"></p>
      </section>

      <div class="summary">
        <span id="settingsSummary"></span>
        <button type="button" class="btn" id="settingsToggle" aria-expanded="false" aria-controls="settingsDetail"><span id="settingsToggleLabel" data-i18n="settingsExpand"></span><svg class="settings-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></svg></button>
      </div>

      <div class="settings-detail" id="settingsDetail" hidden>
        <section>
          <div class="gsp"><span data-i18n="aiSectionLabel"></span></div>
          <div class="grp">
            <div class="row" id="aiRow">
              <div class="txt">
                <div class="t" data-i18n="aiDetectLabel"></div>
                <div class="d" data-i18n="aiDetectHint"></div>
              </div>
              <button type="button" class="sw" id="aiDetect" role="switch" aria-checked="true" data-i18n-aria-label="aiDetectLabel"><i></i></button>
            </div>
          </div>
        </section>

        <section>
          <div class="gsp"><span data-i18n="keywordsLabel"></span><span id="kwCount"></span></div>
          <div class="kw-panel">
            <div class="kw" id="kwBox">
              <ul class="chips" id="chips" style="display: contents" data-i18n-aria-label="keywordsAddedAriaLabel"></ul>
              <input id="kwInput" type="text" maxlength="20" spellcheck="false" data-i18n-placeholder="keywordsPlaceholder" data-i18n-aria-label="keywordsAddAriaLabel" />
            </div>
            <div class="presets">
              <span data-i18n="keywordsPresetsLabel"></span>
              <button type="button" data-preset="crypto"></button>
              <button type="button" data-preset="marketingKeywordAffiliate"></button>
              <button type="button" data-preset="marketingKeywordCashback"></button>
            </div>
          </div>
        </section>

        <section>
          <div class="gsp"><span data-i18n="sensitivityLabel"></span></div>
          <div class="seg" role="radiogroup" data-name="threshold" data-i18n-aria-label="sensitivityLabel">
            <button type="button" role="radio" data-value="0.8" aria-checked="false" data-i18n="sensitivityLow"></button>
            <button type="button" role="radio" data-value="0.6" aria-checked="true" data-i18n="sensitivityMid"></button>
            <button type="button" role="radio" data-value="0.4" aria-checked="false" data-i18n="sensitivityHigh"></button>
          </div>
          <p class="note" id="thresholdNote"></p>
        </section>
      </div>

    </div>

    <footer class="pop-foot">
      <span class="grp-inline">
        <button type="button" id="logout" data-i18n="accountLogout"></button>
      </span>
      <span class="grp-inline">
        <a href="https://promosift.app/terms.html" target="_blank" rel="noopener noreferrer" data-i18n="footerTerms"></a>
        <span class="sep-dot" aria-hidden="true">·</span>
        <a href="https://promosift.app/privacy.html" target="_blank" rel="noopener noreferrer" data-i18n="footerPrivacy"></a>
      </span>
    </footer>
  </section>

  <script src="popup.js"></script>
</body>
</html>
